{% raw %}
name: Dashboard CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'dashboard/**'
  pull_request:
    # closed fires on both merge and close; it runs cleanup-preview below
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'dashboard/**'

env:
  PROJECT_NAME: {% endraw %}{{ cookiecutter.project_slug }}-dashboard{% raw %}

# One job so the deployed dist/ is byte-identical to the tested dist/ —
# a second build would re-pull data from a mutable Box link.
jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.action != 'closed'
    # pull-requests: write lets the job comment the preview link on the PR
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Pull data
        run: python3 scripts/pull_data.py

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: dashboard/playwright-report/

      # PRs from this repo get a preview deploy. Fork PRs are skipped: GitHub
      # doesn't give them the secrets, so the deploy would fail.
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # On a PR, ref_name is '<number>/merge', so use the PR's branch name.
          BRANCH: ${{ github.head_ref || github.ref_name }}
          # wrangler writes the deploy URLs here as JSON; the next step reads them
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        # --branch makes the target environment explicit: 'main' deploys to
        # production (the Pages project's production branch must be 'main');
        # any other branch lands in the preview environment, at
        # https://<branch>.<project>.pages.dev (Cloudflare lowercases the
        # branch and replaces '/' etc. with '-').
        run: npx --no-install wrangler pages deploy dist --branch="$BRANCH" --project-name="$PROJECT_NAME"

      # One comment per PR, edited in place on later pushes instead of re-posted.
      - name: Comment preview link on PR
        if: github.event_name == 'pull_request' && steps.deploy.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # GITHUB_SHA is GitHub's temporary merge commit on PRs; use the branch's commit
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          URL=$(jq -r 'select(.type == "pages-deploy-detailed") | .alias // .url' "$RUNNER_TEMP/wrangler-output.json")
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none \
            --body "Dashboard preview for ${HEAD_SHA::7}: $URL"

  # When a PR is merged or closed, delete its branch's preview deploys so old
  # previews don't stay public.
  cleanup-preview:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ponytail: `deployment list` only returns the newest page of deploys
      # (about 25), so a PR with more pushes than that leaves its oldest
      # previews behind; loop over pages via the API if that matters.
      - name: Delete preview deploys for this branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref }}
        # --force deletes the deploy the branch URL points at too, and skips
        # the confirmation prompt.
        run: |
          set -o pipefail  # fail the step if the list command fails
          npx --no-install wrangler pages deployment list --project-name="$PROJECT_NAME" --environment=preview --json \
            | jq -r --arg branch "$BRANCH" '.[] | select(.Branch == $branch) | .Id' \
            | while read -r id; do
                npx --no-install wrangler pages deployment delete "$id" --project-name="$PROJECT_NAME" --force
              done{% endraw %}
