services:
  {{ cookiecutter.project_slug }}:
    # Docker image references must be lowercase; the slug can contain uppercase
    image: {{ cookiecutter.project_slug|lower }}
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/project
      {% if cookiecutter.data_dir != 'none' %}- ${DATA_DIR}:/data{% endif %}
    {% if cookiecutter.data_dir != 'none' %}
    environment:
      DATA_DIR: /data
    {% endif %}
    shm_size: '16gb'
    # At least one of stdin_open or tty is required to make devcontainer work
    stdin_open: true
    tty: true